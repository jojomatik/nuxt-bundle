name: Build template and deploy to vercel
on: push

jobs:
  yarn_build:
    name: Build template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: 
          repository: jojomatik/nuxt-3-base
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Install correct version of nuxt-bundle
        run: NODE_OPTIONS="--max_old_space_size=4096" yarn add ${{ github.repository }}#${{ github.ref }}
      - name: Build
        run: NODE_OPTIONS="--max_old_space_size=4096" yarn build
      - name: Install ESLint Prettier plugin
        run: yarn add --dev eslint-plugin-prettier@5.5.7
      - name: Lint
        run: yarn lint

  vercel_deploy:        
    name: Deploy template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: 
          repository: jojomatik/nuxt-3-base
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Install correct version of nuxt-bundle
        run: NODE_OPTIONS="--max_old_space_size=4096" yarn add ${{ github.repository }}#${{ github.ref }}
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: NODE_OPTIONS="--max_old_space_size=4096" vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NITRO_PRESET: vercel
          NUXT_IMAGE_PROVIDER: vercel
      - name: Deploy Project Artifacts to Vercel (Preview)
        if: github.ref != 'refs/heads/main'
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel (Prod)
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

